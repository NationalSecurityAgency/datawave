# this log4j file is for the StatisticalQueryTest
# because the test framework executes hundreds of queries the logging produced by
# query planning is largely suppressed

log4j.rootLogger=DEBUG, R
log4j.appender.R=org.apache.log4j.ConsoleAppender
log4j.appender.R.layout=org.apache.log4j.PatternLayout
log4j.appender.R.layout.ConversionPattern=%d %p %C:%L %t %m%n
log4j.appender.R.encoding=UTF-8

#log4j.logger.org.apache.commons.jci=OFF
#log4j.logger.datawave.query.iterators.bb.BoundingBoxIterator=OFF
#log4j.logger.datawave.query.iterators.bb.SelectorSearchingIterator=OFF
log4j.logger.datawave=info
log4j.logger.datawave.query=info
log4j.logger.datawave.query.*=info

log4j.logger.datawave.ingest.data.normalizer=FATAL
log4j.logger.org.apache.commons.jexl2.JexlEngine=ERROR
log4j.logger.org.springframework=WARN
log4j.logger.org.apache.hadoop=WARN

log4j.logger.datawave.ingest=WARN
log4j.logger.datawave.query.testframework=INFO
# enable dump of tables by setting value to debug
log4j.logger.datawave.helpers.PrintUtility=info

# set DefaultQueryPlanner to debug for analysis of query plan
log4j.logger.datawave.query.planner.DefaultQueryPlanner=WARN
log4j.logger.datawave.query.jexl.visitors.validate.ASTValidator=WARN
log4j.logger.datawave.query.config.ShardQueryConfiguration=OFF
log4j.logger.datawave.query.util.DateIndexHelper=OFF
log4j.logger.datawave.query.util.MetadataHelper=OFF

# produces noisy messages:
# "Datawave BatchScanner Session b5cb0c6c-df16-4f34-aa91-8e0ae881865c -1 ?: variable '$1_1' is undefined"
log4j.logger.org.apache.commons.jexl3.JexlEngine=OFF

log4j.logger.datawave.query.tables.ShardQueryLogic=ERROR
log4j.logger.datawave.query.jexl.visitors.* = OFF
log4j.logger.org.apache.commons.beanutils=INFO
log4j.logger.org.apache.accumulo=INFO

#log4j.logger.datawave.query.iterator.facets=DEBUG
#log4j.logger.datawave.query.tables.facets=DEBUG

# suppress bean provider messages
log4j.logger.datawave.configuration.spring=ERROR

# suppress noisy MiniAccumuloCluster logging
log4j.logger.org.apache.zookeeper=ERROR
log4j.logger.org.apache.accumulo.miniclusterImpl=ERROR
log4j.logger.org.apache.accumulo.start.classloader=ERROR
log4j.logger.io.micrometer=ERROR
