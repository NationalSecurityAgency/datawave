log4j.rootCategory=INFO, CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%-5p [%C{1}:%M] %m%n

# An appender that will include the thread name as part of the recorded log
log4j.appender.THREAD_TRACER=org.apache.log4j.ConsoleAppender
log4j.appender.THREAD_TRACER.layout=org.apache.log4j.PatternLayout
log4j.appender.THREAD_TRACER.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p (%t) [%C{1}:%M] %m%n

# Uncomment the following to see up to TRACE level events for the limit package with the thread name included.
# Useful for debugging issues with datawave.webservice.query.limit.QueryLimiterConcurrencyTest
log4j.logger.datawave.webservice.query.limit=TRACE, THREAD_TRACER
log4j.additivity.datawave.webservice.query.limit=false
