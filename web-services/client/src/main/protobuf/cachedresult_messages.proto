syntax = "proto3";

package datawave.webservice.results.cached.result;
option optimize_for = LITE_RUNTIME;
option java_package = "datawave.webservice.results.cached.result";

message ColumnVisibility {
	string visibility = 1;
}

message Attribute {
	string name = 1;
}

message Description {
	string view = 1;
	repeated Attribute attributes = 2;
	repeated ColumnVisibility visibilities = 3;
}

