log4j.rootCategory=INFO, CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%-5p [%C{1}:%M] %m%n

# See TRACE level events for the datawave.security package.
log4j.logger.datawave.security=TRACE, CONSOLE
log4j.additivity.datawave.security=false
