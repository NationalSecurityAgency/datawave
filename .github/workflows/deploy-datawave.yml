name: Deploy

on:
  push:
    paths-ignore: ['**/*.md', '.github/**', 'CODEOWNERS', 'LICENSE']
    tags:
      - "**"
    branches:
      - 'integration'
      - 'release/version*'
      - 'docker-images'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  IMAGE_NAME: ${{ github.repository.lowercase }}
  JAVA_VERSION: '11'
  JAVA_DISTRIBUTION: 'zulu' #This is the default on v1 of the action for 1.8
  MAVEN_OPTS: "-Djansi.force=true -Dhttps.protocols=TLSv1.2 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Djava.awt.headless=true -XX:ThreadStackSize=1m -Daether.connector.basic.threads=8 -Daether.metadataResolver.threads=8 -Daether.syncContext.named.time=480"
  GITHUB_REGISTRY: ghcr.io
  GITHUB_USERNAME: ${{ secrets.GHCR_WRITE_USER_NAME }}
  GITHUB_PASSWORD: ${{ secrets.GHCR_WRITE_ACCESS_TOKEN }}

jobs:
  deploy-packages-and-images:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.GITHUB_REGISTRY }}
        username: ${{ secrets.GHCR_WRITE_USER_NAME }}
        password: ${{ secrets.GHCR_WRITE_ACCESS_TOKEN }}
    - name: Checkout Code
      uses: actions/checkout@v6
    # Clean up free space
    - uses: ./.github/actions/free-space
      with:
        tool-cache: false
    - name: Configure Maven Settings
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<'EOF'
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
               xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
        <servers>
         <server>
           <id>github-datawave</id>
           <username>${env.GITHUB_USERNAME}</username>
           <password>${env.GITHUB_PASSWORD}</password>
         </server>
        </servers>
        <mirrors>
         <mirror>
           <id>google-maven-central</id>
           <name>Google Cloud Maven Central Mirror</name>
           <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
           <mirrorOf>central</mirrorOf>
         </mirror>
        </mirrors>
        </settings>
        EOF
    - name: Set up JDK ${{env.JAVA_VERSION}}
      uses: actions/setup-java@v5
      with:
        distribution: ${{env.JAVA_DISTRIBUTION}}
        java-version: ${{env.JAVA_VERSION}}
        cache: 'maven'
        overwrite-settings: false
    - name: Build and Push DataWave web/ingest images and packages
      run: |
        docker info
        MVN_CMD="mvn --show-version --batch-mode --errors --no-transfer-progress --fail-at-end clean deploy -Pkubernetes -Dmaven.build.cache.enabled=false -Dtar -Ddeploy -Ddist -Ddocker-release -Dutils -Dservices -Dstarters -DskipTests -DskipFormat -DskipSpotbugs -Denforcer.skip=true -Dcheckstyle.skip=true"
        $MVN_CMD || {
          # On tag builds, release artifacts already exist in the registry from when the release was
          # cut. The resulting deploy conflict cascades and bans assemble-webservice, preventing the
          # Docker image push. Retry skipping Maven artifact deployment to at least push the images.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "Deploy failed on tag build; retrying with -Dmaven.deploy.skip=true to push Docker images"
            $MVN_CMD -Dmaven.deploy.skip=true
          else
            exit 1
          fi
        }
    - name: Build and Push microservice images
      run: |
        mvn --show-version --batch-mode --errors --no-transfer-progress --fail-at-end clean deploy -Dmaven.build.cache.enabled=false -Dmicroservice-docker -Dservices -Dstarters -DskipTests -DskipFormat -DskipSpotbugs -Denforcer.skip=true -Dcheckstyle.skip=true -Dmaven.deploy.skip=true
