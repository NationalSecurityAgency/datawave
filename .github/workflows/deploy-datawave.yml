#
name: Publish all DataWave images and packages

on:
  push:
    paths-ignore: ['*.md', 'CODEOWNERS', 'LICENSE']
    tags:
      - "**"
    branches:
      - 'integration'
      - 'release/version*'
      - 'docker-images'
  workflow_dispatch:

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository.lowercase }}
  JAVA_VERSION: '11'
  JAVA_DISTRIBUTION: 'zulu' #This is the default on v1 of the action for 1.8
  MAVEN_OPTS: "-Djansi.force=true -Dhttps.protocols=TLSv1.2 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Djava.awt.headless=true -XX:ThreadStackSize=1m"
  USER_NAME: ${{ secrets.GHCR_WRITE_USER_NAME }}
  ACCESS_TOKEN: ${{ secrets.GHCR_WRITE_ACCESS_TOKEN }}

jobs:
  build-and-push-datawave-images:
    runs-on: ubuntu-latest
    steps:
    - name: Log in to the Container registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.USER_NAME }}
        password: ${{ env.ACCESS_TOKEN }}
    - name: Checkout Code
      uses: actions/checkout@v4
    # Clean up free space
    - uses: ./.github/actions/free-space
      with:
        tool-cache: false
    - name: Set up JDK ${{env.JAVA_VERSION}}
      uses: actions/setup-java@v4
      with:
        distribution: ${{env.JAVA_DISTRIBUTION}}
        java-version: ${{env.JAVA_VERSION}}
        cache: 'maven'
    - name: Build and Push all DataWave images and packages
      run: |
        docker info
        mvn -s $GITHUB_WORKSPACE/.github/workflows/settings.xml -V -B -e -ntp clean deploy -Pkubernetes -Dtar -Ddeploy -Ddist -Ddocker-release -Dservices -Dstarters -Dutils -DskipTests -DskipFormat -DskipSpotbugs -Denforcer.skip=true -Dcheckstyle.skip=true
        mvn -s $GITHUB_WORKSPACE/.github/workflows/settings.xml -V -B -e -ntp clean deploy -Ddocker.image.prefix=ghcr.io/nationalsecurityagency/datawave- -Dmicroservice-docker -Dservices -Dstarters -DskipTests -DskipFormat -DskipSpotbugs -Denforcer.skip=true -Dcheckstyle.skip=true -Dmaven.deploy.skip=true
