<html xmlns:th="http:/>/www.thymeleaf.org">
<!--/*
    HTML page for QueryMetricResponse
*/-->
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>DATAWAVE - Query SubPlans</title>
    <link rel="stylesheet" type="text/css" media="screen" th:href="${basePath + '/css/screen.css'}">
    <link rel="stylesheet" type="text/css" th:href="${basePath + '/css/theme.css'}"> <!--/* styling for query metric page */-->
</head>
<body>
<div th:utext="${header}"></div>
<h1>Query Subplans</h1>
<div th:each="metric,metricIter : ${metricList}">
    <a th:href="${metric.queryIdUrl}" th:text="${metric.queryId}"></a>
    <br/>
    <table>
        <tr>
            <th>SubPlan</th>
            <th>Document Range Count</th>
            <th>Shard Range Count</th>
        </tr>
        <tr th:each="entry : ${metric.subplansStr}" th:class="(${entryStat.index} % 2 == 0) ? 'highlight' : ''">
            <td th:text="${entry.key}">keyvalue</td>
            <td th:text="${entry.value.documentRangeCount}">num</td>
            <td th:text="${entry.value.shardRangeCount}">num</td>
        </tr>
    </table>
</div>
</body>
</html>
