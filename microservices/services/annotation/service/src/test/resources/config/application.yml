spring:
  application:
    name: annotation-test
  autoconfigure:
    exclude:
    - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
    - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
    - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

  security:
    user.password: passwordNotUsed
    datawave:
      jwt.ttl: 3600
      issuers-required: true
      allowed-callers:
        - "cn=test.testcorp.com, ou=microservices, ou=development, o=testcorp, c=us<cn=testcorp ca, ou=security, o=testcorp, c=us>"

hazelcast.client.enabled: false

server:
  port: 0
  non-secure-port: 0
  servlet.context-path: /annotation
  ssl:
    client-auth: NEED
    trust-store: classpath:ssl/rootCA.p12
    trust-store-type: PKCS12
    trust-store-password: LetMeIn
    key-store: classpath:ssl/host.p12
    key-store-type: PKCS12
    key-store-password: LetMeIn
  outbound-ssl:
    key-store: ${server.ssl.key-store}
    key-store-password: ${server.ssl.key-store-password}
    key-store-type: ${server.ssl.key-store-type}
    trust-store: ${server.ssl.trust-store}
    trust-store-password: ${server.ssl.trust-store-password}
    trust-store-type: ${server.ssl.trust-store-type}

management:
  endpoints:
    web:
      base-path: "/mgmt"

annotation:
  # The maximum amount of queries we support before reporting Unready
  max-connections: 40

  # By default, query content cloud - set cluster specific config overrides
  datawave-query-host: "localhost:9443"

  # Table names - annotation for reads, truthmark for writes. 
  annotation-table-name: "annotation"
  annotation-source-table-name: "annotationSource"
  truthmark-table-name: "truthmark"
  truthmark-source-table-name: "truthmarkSource"

  shard-table-name: "shard"
  enable-internal-id-lookup: false

  # Source metadata masking - removes listed keys from sources when injecting
  # into annotations (not in getAnnotationSource endpoint)
  mask-source-metadata:
    - "visibility"

  # Ack/retry protocol for async writes
  annotation-ack-enabled: true
  annotation-ack-timeout-millis: 500

  # These are all possible Datawave Response classes that we can parse and pass to the client
  datawave-response-classes:
    - "datawave.webservice.result.GenericResponse"
    - "datawave.webservice.result.VoidResponse"
    - "datawave.webservice.result.DefaultEventQueryResponse"

  annotationUnknownFieldsIgnored: false

swagger:
  doc:
    packages: datawave.microservice.annotation

springdoc:
  api-docs:
    path: /apidocs
  show-actuator: true
  writer-with-default-pretty-printer: true
  swagger-ui:
    docExpansion: 'none'
    operationsSorter: 'method'
    tagsSorter: 'alpha'

logging:
  level:
    root: FATAL
    datawave.microservice.annotation: FATAL
    io.undertow.request: FATAL

---

spring.config.activate.on-profile: log-enabled

annotation:
  writers:
    log:
      enabled: true

---

spring.config.activate.on-profile: log-disabled

annotation:
  writers:
    log:
      enabled: false

---

spring.config.activate.on-profile: accumulo-enabled

annotation:
  writers:
    accumulo:
      enabled: true
      accumuloConfig:
        zookeepers: "test"
        instanceName: "test"
        username: "test"
        password: "test"

---

spring.config.activate.on-profile: accumulo-disabled

annotation:
  writers:
    accumulo:
      enabled: false

---

spring.config.activate.on-profile: missing

---
spring.config.activate.on-profile: rabbit-config

annotation:
  health:
    rabbit:
      enabled: true
      healthyPollIntervalMillis: 5000
      unhealthyPollIntervalMillis: 1000
      attemptRecovery: true
      fixMissing: true
      fixInvalid: true
      queues:
        - name: 'annotation.log'
          durable: true
          exclusive: false
          autoDelete: false
          arguments:
            'x-dead-letter-exchange': 'DLX'
            'x-dead-letter-routing-key': 'annotation.log'
        - name: 'annotation.log.dlq'
          durable: true
          exclusive: false
          autoDelete: false
      exchanges:
        - name: 'annotation'
          type: 'topic'
          durable: true
          autoDelete: false
          internal: false
          delayed: false
        - name: 'DLX'
          type: 'direct'
          durable: true
          autoDelete: false
          internal: false
          delayed: false
      bindings:
        - destination: 'annotation.log'
          destinationType: 'queue'
          source: 'annotation'
          routingKey: '#'
        - destination: 'annotation.log.dlq'
          destinationType: 'queue'
          source: 'DLX'
          routingKey: 'annotation.log'
      cluster:
        expectedNodes: 3
        failIfNodeMissing: true
        numChecksBeforeFailure: 3
      management:
        scheme: 'http'
        port: 15672
        uri: '/api/'

---
spring.config.activate.on-profile: replay-config

annotation:
  retry:
    max-attempts: 1
  replay:
    enabled: true
    publish-events: false
    idle-timeout-millis: 1000
