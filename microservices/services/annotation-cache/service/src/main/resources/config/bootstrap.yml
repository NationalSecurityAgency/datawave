annotation-cache:
  max-cache-age: 1h
  max-fetch-age: 5m
  federation-lock-wait: 5s
  topology-monitoring-enabled: true
  topology-settle-delay: 15s
  topology-poll-interval-ms: 5000

spring:
  application:
    name: annotation-cache
  cloud:
    config:
      # Disable consul-first config by default. We'll turn it back on in the consul profile if that profile is enabled.
      discovery:
        enabled: false
      # Always fail fast so we can retry if the config server is not up yet
      failFast: true
      # Give the config server time to start up if it hasn't already
      retry:
        max-attempts: 60
      uri: '${CONFIG_SERVER_URL:http://configuration:8888/configserver}'
      allow-override: true
    function:
      # Activates the annotation cache consumer and Spring Cloud Bus consumer.
      definition: "loadCache;busConsumer"
    stream:
      bindings:
        persisted-out-0:
          # Publish local write-through annotations to the exchange declared by RabbitTopologyConfig.
          destination: annotation
          # Required for protobuf serialization of outbound AnnotationMessage payloads.
          content-type: application/x-protobuf
        loadCache-in-0:
          # Consume federated annotation messages from the annotation exchange.
          destination: annotation
          # Uses the durable annotation.cache queue declared by RabbitTopologyConfig.
          group: cache
          # Required to deserialize inbound AnnotationMessage payloads.
          content-type: application/x-protobuf
      rabbit:
        bindings:
          persisted-out-0:
            producer:
              # Preserve published messages across broker restarts when routed to durable queues.
              delivery-mode: PERSISTENT
              # Uses AnnotationMapStore's confirm-correlation header; enables mandatory publishing and returns on CorrelationData without an error channel.
              use-confirm-header: true
  rabbitmq:
    # Correlated confirms complete the CorrelationData future awaited by AnnotationMapStore.
    publisher-confirm-type: correlated

---

# For the dev profile, check localhost for the config server by default
spring:
  config.activate.on-profile: 'dev'
  cloud:
    config:
      uri: '${CONFIG_SERVER_URL:http://localhost:8888/configserver}'

---

spring:
  config.activate.on-profile: 'consul'
  cloud:
    config:
      # Use Consul to locate the configuration server and bootstrap app config.
      discovery:
        enabled: true
      # Give the config server a long time to come up and register itself in Consul
      retry:
        max-attempts: 120
    # Allow the default Consul host to be overridden via an environment variable
    consul:
      host: ${CONSUL_HOST:localhost}
      discovery:
        scheme: https
        instance-id: ${spring.application.name}:${vcap.application.instance_id:${spring.application.instance_id:${random.value}}}
        health-check-path: ${server.servlet.context-path}${management.endpoints.web.base-path}/health
        health-check-interval: 15s
